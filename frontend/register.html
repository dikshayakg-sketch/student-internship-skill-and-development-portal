<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Student Internship Portal
            </a>

            <a href="login.html" class="btn btn-light">
                Login
            </a>

        </div>

    </nav>


    <!-- Registration Form -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-lg">

                    <div class="card-body p-4">

                        <h2 class="text-center text-primary mb-2">
                            Create Student Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register to find and apply for internships
                        </p>


                        <form id="registerForm">

                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- Department -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Department
                                </label>

                                <input
                                    type="text"
                                    id="department"
                                    class="form-control"
                                    placeholder="Example: Computer Science and Engineering"
                                    required>

                            </div>


                            <!-- Year -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Year
                                </label>

                                <select
                                    id="year"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select your year
                                    </option>

                                    <option value="1">
                                        1st Year
                                    </option>

                                    <option value="2">
                                        2nd Year
                                    </option>

                                    <option value="3">
                                        3rd Year
                                    </option>

                                    <option value="4">
                                        4th Year
                                    </option>

                                </select>

                            </div>


                            <!-- Skills -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Skills
                                </label>

                                <input
                                    type="text"
                                    id="skills"
                                    class="form-control"
                                    placeholder="Java, HTML, CSS, JavaScript">

                                <small class="text-muted">
                                    Separate multiple skills with commas.
                                </small>

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                    required>

                            </div>


                            <!-- Register Button -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 mt-2">

                                Create Account

                            </button>

                        </form>


                        <!-- Result Message -->

                        <div
                            id="message"
                            class="mt-3 text-center">
                        </div>


                        <!-- Login Link -->

                        <p class="text-center mt-4 mb-0">

                            Already have an account?

                            <a href="login.html">
                                Login here
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
