<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Internships</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="dashboard.html">
                Student Internship Portal
            </a>

            <div>

                <a href="applications.html"
                   class="btn btn-light me-2">
                    My Applications
                </a>

                <a href="dashboard.html"
                   class="btn btn-outline-light">
                    Dashboard
                </a>

            </div>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container py-5">

        <div class="text-center mb-4">

            <h2 class="text-primary">
                Available Internships
            </h2>

            <p class="text-muted">
                Find internship opportunities based on your skills
            </p>

        </div>


        <!-- Search and Filters -->

        <div class="card shadow mb-4">

            <div class="card-body">

                <h5 class="mb-3">
                    Search & Filter
                </h5>

                <div class="row">

                    <!-- Search -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Search
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search company, role or skill">

                    </div>


                    <!-- Location -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <select
                            id="locationFilter"
                            class="form-select">

                            <option value="">
                                All Locations
                            </option>

                        </select>

                    </div>


                    <!-- Domain -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Domain
                        </label>

                        <select
                            id="domainFilter"
                            class="form-select">

                            <option value="">
                                All Domains
                            </option>

                            <option value="Java">
                                Java
                            </option>

                            <option value="Web Development">
                                Web Development
                            </option>

                            <option value="Python">
                                Python
                            </option>

                            <option value="Data Science">
                                Data Science
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>


        <!-- Internship List -->

        <div id="internshipList">

            <div class="text-center text-muted">
                Loading internships...
            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        <p class="mb-0">
            Student Internship & Skill Development Portal
        </p>

        <small>
            College Mini Project
        </small>

    </footer>


    <script src="js/internships.js"></script>

</body>

</html>
